name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"

env:
  DATABASE_URL: file:./dev.db

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and boot feature-flag-admin
        run: |
          docker compose -f apps/feature-flag-admin/docker-compose.yml up -d --build

      - name: Smoke test the running container
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused \
            http://localhost:3001/flags | grep -q "checkout.new_ui"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f apps/feature-flag-admin/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f apps/feature-flag-admin/docker-compose.yml down -v
